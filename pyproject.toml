[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "buddy-cli"
version = "1.0.0"
description = "Control the Buddy desk device (LED, solenoid jump) over USB from scripts, Claude Code or Codex."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "esptool>=4.7",
    "hidapi>=0.14",
]

[project.scripts]
buddy = "buddy.cli:main"

[tool.setuptools.packages.find]
include = ["buddy*"]
